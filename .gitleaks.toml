# Gitleaks configuration. Fake values must contain "not-real". Verified with gitleaks 8.30.
title = "Truman Show Project"

[extend]
useDefault = true

[[rules]]
id = "truman-admin-token-assignment"
description = "Project credential assigned a literal value"
regex = '''(?i)\b(admin_token|supabase_service_key|gemini_api_key|groq_api_key|tavily_api_key|cloudflare_api_token|cloudflare_pages_deploy_token|snapshot_pages_token)["']?\s*[:=]\s*["']?[A-Za-z0-9_\-\.]{16,}'''
tags = ["key", "truman"]

[allowlist]
description = "Fake fixtures, templates, build output and local tool state"
regexTarget = "match"
paths = [
  '''\.env\.example$''',
  '''docs/12-security-and-secrets\.md$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)graphify-out/''',
  '''(^|/)fixtures/''',
  '''\.(test|leak\.test|fixture-test)\.[cm]?[jt]s$''',
]
regexes = [
  '''not-real''',
  '''\[redacted\]''',
  '''REDACTED''',
]
