name: deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: Production service to deploy
        required: true
        type: choice
        options: [worker, viewer]
permissions:
  contents: read
concurrency:
  group: truman-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm leak-test

      - name: Deploy Worker
        if: inputs.target == 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          CLOUDFLARE_PAGES_VIEWER_URL: ${{ vars.CLOUDFLARE_PAGES_VIEWER_URL }}
          CLOUDFLARE_PAGES_SNAPSHOT_PROJECT: ${{ vars.CLOUDFLARE_PAGES_SNAPSHOT_PROJECT }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set the encrypted production Worker deploy secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the encrypted production account ID}"
          : "${CLOUDFLARE_WORKER_URL:?Set the production Worker URL}"
          : "${CLOUDFLARE_PAGES_VIEWER_URL:?Set the production viewer origin}"
          : "${CLOUDFLARE_PAGES_SNAPSHOT_PROJECT:?Set the production snapshot project}"
          pnpm --filter @truman/worker exec wrangler deploy \
            --var "ALLOWED_ORIGINS:$CLOUDFLARE_PAGES_VIEWER_URL" \
            --var "SNAPSHOT_PAGES_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" \
            --var "SNAPSHOT_PAGES_PROJECT:$CLOUDFLARE_PAGES_SNAPSHOT_PROJECT"
          node --input-type=module <<'JS'
          const origin = process.env.CLOUDFLARE_PAGES_VIEWER_URL;
          const url = new URL("/api/status", process.env.CLOUDFLARE_WORKER_URL);
          const response = await fetch(url, {
            headers: { origin },
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok || response.headers.get("access-control-allow-origin") !== origin) {
            throw new Error(`Worker API or viewer CORS check failed (HTTP ${response.status})`);
          }
          JS

      - name: Build viewer
        if: inputs.target == 'viewer'
        env:
          VITE_API_BASE: ${{ vars.CLOUDFLARE_WORKER_URL }}
          VITE_SNAPSHOT_BASE: ${{ vars.CLOUDFLARE_PAGES_SNAPSHOT_URL }}
        run: |
          set -euo pipefail
          : "${VITE_API_BASE:?Set the production Worker URL}"
          : "${VITE_SNAPSHOT_BASE:?Set the production snapshot origin}"
          pnpm --filter @truman/viewer build

      - name: Deploy viewer
        if: inputs.target == 'viewer'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_VIEWER_PROJECT: ${{ vars.CLOUDFLARE_PAGES_VIEWER_PROJECT }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Set the encrypted production Pages deploy secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the encrypted production account ID}"
          : "${CLOUDFLARE_PAGES_VIEWER_PROJECT:?Set the production viewer project}"
          mkdir -p "$RUNNER_TEMP/truman-viewer"
          pnpm --filter @truman/worker exec wrangler --cwd "$RUNNER_TEMP/truman-viewer" \
            pages deployment list --project-name "$CLOUDFLARE_PAGES_VIEWER_PROJECT"
          pnpm --filter @truman/worker exec wrangler --cwd "$RUNNER_TEMP/truman-viewer" \
            pages deploy "$GITHUB_WORKSPACE/apps/viewer/dist" \
            --project-name "$CLOUDFLARE_PAGES_VIEWER_PROJECT" --branch main

      - name: Check published viewer
        if: inputs.target == 'viewer'
        env:
          CLOUDFLARE_PAGES_VIEWER_URL: ${{ vars.CLOUDFLARE_PAGES_VIEWER_URL }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_PAGES_VIEWER_URL:?Set the production viewer origin}"
          node --input-type=module <<'JS'
          const response = await fetch(process.env.CLOUDFLARE_PAGES_VIEWER_URL, {
            redirect: "error",
            signal: AbortSignal.timeout(15_000),
          });
          if (response.status !== 200 || !response.headers.get("content-type")?.startsWith("text/html")) {
            throw new Error(`Expected viewer HTML (HTTP ${response.status})`);
          }
          JS
